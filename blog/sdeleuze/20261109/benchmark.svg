<line class="grid" x1="316.8" x2="316.8" y1="70" y2="250" stroke-width="1"/>
<text class="tick" x="316.8" y="268" text-anchor="middle">10K</text>
<line class="grid" x1="403.6" x2="403.6" y1="70" y2="250" stroke-width="1"/>
<text class="tick" x="403.6" y="268" text-anchor="middle">20K</text>
<line class="grid" x1="490.4" x2="490.4" y1="70" y2="250" stroke-width="1"/>
<text class="tick" x="490.4" y="268" text-anchor="middle">30K</text>
<line class="grid" x1="577.2" x2="577.2" y1="70" y2="250" stroke-width="1"/>
<text class="tick" x="577.2" y="268" text-anchor="middle">40K</text>
<line class="grid" x1="664.0" x2="664.0" y1="70" y2="250" stroke-width="1"/>
<text class="tick" x="664.0" y="268" text-anchor="middle">50K</text>
<text class="label" x="218" y="95.0" text-anchor="end">Compose HTML with lowering</text>
<path class="bar" d="M230,78 H594.5 Q598.5,78 598.5,82 V98 Q598.5,102 594.5,102 H230 Z"/>
<text class="value" x="606.5" y="95.0">42,453</text>
<text class="label" x="218" y="141.0" text-anchor="end">Compose HTML without lowering</text>
<path class="bar" d="M230,124 H447.7 Q451.7,124 451.7,128 V144 Q451.7,148 447.7,148 H230 Z"/>
<text class="value" x="459.7" y="141.0">25,545</text>
<text class="label" x="218" y="187.0" text-anchor="end">JMustache</text>
<path class="bar" d="M230,170 H267.5 Q271.5,170 271.5,174 V190 Q271.5,194 267.5,194 H230 Z"/>
<text class="value" x="279.5" y="187.0">4,779</text>
<text class="label" x="218" y="233.0" text-anchor="end">Thymeleaf</text>
<path class="bar" d="M230,216 H260.3 Q264.3,216 264.3,220 V236 Q264.3,240 260.3,240 H230 Z"/>
<text class="value" x="272.3" y="233.0">3,953</text>
<line class="base" x1="230" x2="230" y1="70" y2="250" stroke-width="1"/>
</svg>
