<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 344" width="1000" role="img" aria-labelledby="decision-guardrail-flow-title decision-guardrail-flow-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="#1f2328">
<defs><marker id="decision-guardrail-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328" fill-opacity="0.6"/></marker><marker id="decision-guardrail-flow-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6DB33F"/></marker><marker id="decision-guardrail-flow-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F7DE0"/></marker></defs>
<title id="decision-guardrail-flow-title">One turn through the guardrail advisor</title>
<desc id="decision-guardrail-flow-desc">The DecisionGuardrailAdvisor of Spring AI Decision Extensions screens a turn twice. Its input battery screens the user message with one call of the DecisionModel that carries all hazards of the battery. When the outcome is BLOCK or SUPPORT, a refusal goes back to the user and the chat model is never called. When the message passes, the chat model writes the reply. The output battery then screens the reply with one more decision call. When that outcome is BLOCK or SUPPORT, the refusal replaces the reply; otherwise the reply goes to the user. A REVIEW is a borderline result: it passes and is logged, unless blockOnReview is set. The DecisionModel can be Ollama, OpenAI or System One.</desc>
<rect width="1000" height="344" rx="10" fill="#ffffff"/>
<rect x="16.0" y="74.0" width="120.0" height="60.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1.2"/><text x="76.0" y="100.0" text-anchor="middle" font-size="13.5" font-weight="700">User message</text><text x="76.0" y="119.0" text-anchor="middle" font-size="11.5" fill-opacity="0.85">the question</text>
<rect x="206.0" y="74.0" width="170.0" height="60.0" rx="8" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="291.0" y="100.0" text-anchor="middle" font-size="13.5" font-weight="700">Input battery</text><text x="291.0" y="119.0" text-anchor="middle" font-size="11.5" fill-opacity="0.85">screens the user message</text>
<rect x="446.0" y="74.0" width="120.0" height="60.0" rx="8" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="506.0" y="100.0" text-anchor="middle" font-size="13.5" font-weight="700">Chat model</text><text x="506.0" y="119.0" text-anchor="middle" font-size="11.5" fill-opacity="0.85">writes the reply</text>
<rect x="636.0" y="74.0" width="170.0" height="60.0" rx="8" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="721.0" y="100.0" text-anchor="middle" font-size="13.5" font-weight="700">Output battery</text><text x="721.0" y="119.0" text-anchor="middle" font-size="11.5" fill-opacity="0.85">screens the reply</text>
<rect x="876.0" y="74.0" width="108.0" height="60.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1.2"/><text x="930.0" y="100.0" text-anchor="middle" font-size="13.5" font-weight="700">Reply</text><text x="930.0" y="119.0" text-anchor="middle" font-size="11.5" fill-opacity="0.85">to the user</text>
