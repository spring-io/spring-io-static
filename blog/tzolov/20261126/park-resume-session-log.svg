<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 618" width="1000" role="img" aria-labelledby="park-resume-session-log-title park-resume-session-log-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="#1f2328">
<defs><marker id="park-resume-session-log-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328" fill-opacity="0.6"/></marker><marker id="park-resume-session-log-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6DB33F"/></marker><marker id="park-resume-session-log-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F7DE0"/></marker></defs>
<title id="park-resume-session-log-title">Park and resume: two processes and the session log between them</title>
<desc id="park-resume-session-log-desc">Run 1, in process A: the customer asks to collect the payment today, the model asks for the tool retryMortgagePaymentNow, the tool loop pauses without running a tool, and the turn is parked. The session log in the database then holds, in this order: a turn status event running, the user message, the assistant message with the tool call, a turn question event asking to confirm the tool call, and a turn status event parked. Process A exits. Minutes or hours pass, and nothing is held in memory. Run 2, in process B: it finds the parked turn and reads the question from the log, the approver allows the call, the tool runs once, and the model finishes the turn that started in process A. The log gains a turn answer event, a turn status event running, the tool result, the final answer of the assistant, and a turn status event idle. Messages are stored by Spring AI session memory, and the turn events are added by Spring AI Session Extensions.</desc>
<rect width="1000" height="618" rx="10" fill="#ffffff"/>
<rect x="16.0" y="10.0" width="260.0" height="330.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="146.0" y="36.0" text-anchor="middle" font-size="16" font-weight="700">Run 1</text>
<text x="146.0" y="56.0" text-anchor="middle" font-size="12" fill-opacity="0.75">process A</text>
<rect x="318.0" y="10.0" width="364.0" height="558.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="500.0" y="36.0" text-anchor="middle" font-size="16" font-weight="700">Session log</text>
<text x="500.0" y="56.0" text-anchor="middle" font-size="12" fill-opacity="0.75">the events of one session, in the database</text>
<rect x="724.0" y="230.0" width="260.0" height="338.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="854.0" y="256.0" text-anchor="middle" font-size="16" font-weight="700">Run 2</text>
<text x="854.0" y="276.0" text-anchor="middle" font-size="12" fill-opacity="0.75">process B, later</text>
<rect x="330.0" y="78.0" width="340.0" height="34.0" rx="6" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="340.0" y="99.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">TURN.STATUS</text><text x="448.0" y="99.5" text-anchor="start" font-size="13">running</text>
<rect x="330.0" y="120.0" width="340.0" height="34.0" rx="6" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="340.0" y="141.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">USER</text><text x="448.0" y="141.5" text-anchor="start" font-size="13">“Please collect it today.”</text>
<rect x="330.0" y="162.0" width="340.0" height="34.0" rx="6" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="340.0" y="183.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">ASSISTANT</text><text x="448.0" y="183.5" text-anchor="start" font-size="13">call retryMortgagePaymentNow</text>
<rect x="330.0" y="204.0" width="340.0" height="34.0" rx="6" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="340.0" y="225.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">TURN.QUESTION</text><text x="448.0" y="225.5" text-anchor="start" font-size="13">confirm the tool call?</text>
<rect x="330.0" y="246.0" width="340.0" height="34.0" rx="6" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="340.0" y="267.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">TURN.STATUS</text><text x="448.0" y="267.5" text-anchor="start" font-size="13">parked (REQUIRES_ACTION)</text>
<rect x="330.0" y="352.0" width="340.0" height="34.0" rx="6" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="340.0" y="373.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">TURN.ANSWER</text><text x="448.0" y="373.5" text-anchor="start" font-size="13">allowed</text>
<rect x="330.0" y="394.0" width="340.0" height="34.0" rx="6" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="340.0" y="415.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">TURN.STATUS</text><text x="448.0" y="415.5" text-anchor="start" font-size="13">running</text>
<rect x="330.0" y="436.0" width="340.0" height="34.0" rx="6" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="340.0" y="457.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">TOOL</text><text x="448.0" y="457.5" text-anchor="start" font-size="13">result: Collected CHF 1450.00</text>
<rect x="330.0" y="478.0" width="340.0" height="34.0" rx="6" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/><text x="340.0" y="499.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">ASSISTANT</text><text x="448.0" y="499.5" text-anchor="start" font-size="13">the final answer</text>
<rect x="330.0" y="520.0" width="340.0" height="34.0" rx="6" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="340.0" y="541.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">TURN.STATUS</text><text x="448.0" y="541.5" text-anchor="start" font-size="13">idle (END_TURN)</text>
<rect x="330.0" y="292.0" width="340.0" height="48.0" rx="6" fill="#1f2328" fill-opacity="0.06" stroke="#1f2328" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="500.0" y="313.0" text-anchor="middle" font-size="12.5" font-weight="600">minutes or hours pass</text>
<text x="500.0" y="330.0" text-anchor="middle" font-size="11.5" fill-opacity="0.75">nothing is held in memory</text>
<rect x="28.0" y="78.0" width="236.0" height="76.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1.2"/><text x="146.0" y="111.5" text-anchor="middle" font-size="13">The customer asks to</text><text x="146.0" y="129.5" text-anchor="middle" font-size="13">collect the payment today</text><path d="M267.0 116.0 L326.0 116.0" fill="none" stroke="#1f2328" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#park-resume-session-log-arrow)"/>
<rect x="28.0" y="162.0" width="236.0" height="34.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1.2"/><text x="146.0" y="183.5" text-anchor="middle" font-size="13">The model asks for the tool</text><path d="M267.0 179.0 L326.0 179.0" fill="none" stroke="#1f2328" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#park-resume-session-log-arrow)"/>
<rect x="28.0" y="204.0" width="236.0" height="76.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1.2"/><text x="146.0" y="237.5" text-anchor="middle" font-size="13">The tool loop pauses, no tool</text><text x="146.0" y="255.5" text-anchor="middle" font-size="13">runs, and the turn is parked</text><path d="M267.0 242.0 L326.0 242.0" fill="none" stroke="#1f2328" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#park-resume-session-log-arrow)"/>
<text x="146.0" y="321.0" text-anchor="middle" font-size="12.5" fill-opacity="0.8" font-style="italic">The process exits.</text>
<rect x="736.0" y="292.0" width="236.0" height="48.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1.2"/><text x="854.0" y="311.5" text-anchor="middle" font-size="13">Finds the parked turn</text><text x="854.0" y="329.5" text-anchor="middle" font-size="13">and reads the question</text>
<path d="M673.0 221.0 L704.0 221.0 L704.0 316.0 L733.0 316.0" fill="none" stroke="#1f2328" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#park-resume-session-log-arrow)"/>
