<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 668" width="960" role="img" aria-labelledby="tool-call-confirmation-sequence-title tool-call-confirmation-sequence-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="#1f2328">
<defs><marker id="tool-call-confirmation-sequence-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328" fill-opacity="0.6"/></marker><marker id="tool-call-confirmation-sequence-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6DB33F"/></marker><marker id="tool-call-confirmation-sequence-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F7DE0"/></marker></defs>
<title id="tool-call-confirmation-sequence-title">One turn that pauses on a tool call</title>
<desc id="tool-call-confirmation-sequence-desc">A sequence between a person who approves, the application, the ChatClient with its tool calling loop, and the chat model. The application sends the user message. The ChatClient sends the prompt and the tools to the model. The model replies with a call of the tool retryMortgagePaymentNow. The tool needs confirmation, so the loop pauses and no tool runs. The ChatClient returns the paused reply to the application, with the calls that wait for a decision, and the application shows the calls to the person. The person decides, now or hours later. The loop keeps nothing while it waits: the prompt and the paused reply hold everything. The person allows or denies each call. The application calls executeToolCalls with the prompt, the reply and the decisions: allowed calls run, and denied calls answer with a message. The application sends the tool results as its next request, the ChatClient sends the conversation and the results to the model, and the answer of the model goes back to the application.</desc>
<rect width="960" height="668" rx="10" fill="#ffffff"/>
<rect x="9.0" y="12.0" width="150.0" height="46.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1.2"/><text x="84.0" y="32.0" text-anchor="middle" font-size="14" font-weight="700">Person</text><text x="84.0" y="49.0" text-anchor="middle" font-size="11" fill-opacity="0.75">the approver</text><path d="M84.0 58 V652" stroke="#1f2328" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 5"/>
<rect x="237.0" y="12.0" width="150.0" height="46.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1.2"/><text x="312.0" y="32.0" text-anchor="middle" font-size="14" font-weight="700">Application</text><text x="312.0" y="49.0" text-anchor="middle" font-size="11" fill-opacity="0.75">your code</text><path d="M312.0 58 V652" stroke="#1f2328" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 5"/>
<rect x="529.0" y="12.0" width="150.0" height="46.0" rx="8" fill="#6DB33F"/><text x="604.0" y="32.0" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ChatClient</text><text x="604.0" y="49.0" text-anchor="middle" font-size="11" fill="#fff">tool calling loop</text><path d="M604.0 58 V652" stroke="#1f2328" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 5"/>
<rect x="797.0" y="12.0" width="150.0" height="46.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1.2"/><text x="872.0" y="32.0" text-anchor="middle" font-size="14" font-weight="700">Model</text><text x="872.0" y="49.0" text-anchor="middle" font-size="11" fill-opacity="0.75">chat model</text><path d="M872.0 58 V652" stroke="#1f2328" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="3 5"/>
