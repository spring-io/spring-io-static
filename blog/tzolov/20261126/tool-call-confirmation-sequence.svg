<path d="M868.0 178.0 L608.0 178.0" fill="none" stroke="#1f2328" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tool-call-confirmation-sequence-arrow)"/><text x="738.0" y="171.0" text-anchor="middle" font-size="12">reply: call retryMortgagePaymentNow</text>
