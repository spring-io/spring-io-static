<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" role="img" aria-labelledby="turn-status-states-title turn-status-states-desc" font-family="'Open Sans', 'Helvetica Neue', Arial, sans-serif" fill="#1f2328">
<defs><marker id="turn-status-states-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f2328" fill-opacity="0.6"/></marker><marker id="turn-status-states-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6DB33F"/></marker><marker id="turn-status-states-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F7DE0"/></marker></defs>
<title id="turn-status-states-title">The states of a turn: idle, running and parked</title>
<desc id="turn-status-states-desc">A session is idle when no turn runs, running while a turn runs, and parked when a turn waits for a person. A call starts a turn, which moves the session from idle to running. When the turn ends or is interrupted, the session is idle again, and it records why the turn ended: END_TURN when it ran to its end, ERROR when it failed, INTERRUPTED when someone stopped it, or CANCELLED when the client left. Only one turn runs at a time, and a second request is refused. When a tool call needs confirmation, the turn is parked. A parked turn is resumed in one of three ways. The approver allows the call: the tool runs once and the model goes on. The approver denies the call: the tool does not run and the model gets the approver's message. The customer writes something new: the open calls are denied and the new text goes to the model.</desc>
<rect width="960" height="370" rx="10" fill="#ffffff"/>
<rect x="30.0" y="64.0" width="160.0" height="62.0" rx="31" fill="none" stroke="#1f2328" stroke-opacity="0.35" stroke-width="1.2"/><text x="110.0" y="91.0" text-anchor="middle" font-size="15" font-weight="700">Idle</text><text x="110.0" y="110.0" text-anchor="middle" font-size="11.5" fill-opacity="0.75">no turn runs</text>
<rect x="400.0" y="64.0" width="160.0" height="62.0" rx="31" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/><text x="480.0" y="91.0" text-anchor="middle" font-size="15" font-weight="700">Running</text><text x="480.0" y="110.0" text-anchor="middle" font-size="11.5" fill-opacity="0.75">a turn runs</text>
<rect x="770.0" y="64.0" width="160.0" height="62.0" rx="31" fill="#3F7DE0"/><text x="850.0" y="91.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Parked</text><text x="850.0" y="110.0" text-anchor="middle" font-size="11.5" fill="#fff">waits for a person</text>
<path d="M194.0 84.0 L396.0 84.0" fill="none" stroke="#1f2328" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#turn-status-states-arrow)"/>
<text x="295.0" y="76.0" text-anchor="middle" font-size="12.5">a call starts a turn</text>
<path d="M396.0 108.0 L194.0 108.0" fill="none" stroke="#1f2328" stroke-opacity="0.6" stroke-width="1.6" marker-end="url(#turn-status-states-arrow)"/>
<text x="295.0" y="126.0" text-anchor="middle" font-size="12.5">the turn ends, or is interrupted</text>
<path d="M564.0 84.0 L766.0 84.0" fill="none" stroke="#3F7DE0" stroke-width="1.6" marker-end="url(#turn-status-states-arrow-blue)"/>
<text x="665.0" y="76.0" text-anchor="middle" font-size="12.5">a tool call needs confirmation</text>
<path d="M766.0 108.0 L564.0 108.0" fill="none" stroke="#3F7DE0" stroke-width="1.6" marker-end="url(#turn-status-states-arrow-blue)"/>
<text x="665.0" y="126.0" text-anchor="middle" font-size="12.5">the turn is resumed</text>
<text x="480.0" y="52.0" text-anchor="middle" font-size="11.5" fill-opacity="0.8" font-style="italic">one turn at a time: a second request is refused</text>
<path d="M665.0 134.0 L665.0 176.0" fill="none" stroke="#1f2328" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="470.0" y="178.0" width="460.0" height="176.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="488.0" y="204.0" text-anchor="start" font-size="13.5" font-weight="700">Three ways out of a parked turn</text>
<circle cx="494" cy="230.0" r="4" fill="#3F7DE0"/>
<text x="508.0" y="234.0" text-anchor="start" font-size="12.5" font-weight="600">The approver allows the call</text>
<text x="508.0" y="252.0" text-anchor="start" font-size="12" fill-opacity="0.85">The tool runs, once, and the model goes on.</text>
<circle cx="494" cy="272.0" r="4" fill="#3F7DE0"/>
<text x="508.0" y="276.0" text-anchor="start" font-size="12.5" font-weight="600">The approver denies the call</text>
<text x="508.0" y="294.0" text-anchor="start" font-size="12" fill-opacity="0.85">The tool does not run. The model gets the approver’s message.</text>
<circle cx="494" cy="314.0" r="4" fill="#3F7DE0"/>
<text x="508.0" y="318.0" text-anchor="start" font-size="12.5" font-weight="600">The customer writes something new</text>
<text x="508.0" y="336.0" text-anchor="start" font-size="12" fill-opacity="0.85">The open calls are denied, and the new text goes to the model.</text>
<text x="30.0" y="204.0" text-anchor="start" font-size="13.5" font-weight="700">Why the last turn ended</text>
<text x="30.0" y="232.0" text-anchor="start" font-size="12" fill-opacity="0.85">END_TURN: it ran to its end</text>
<text x="30.0" y="254.0" text-anchor="start" font-size="12" fill-opacity="0.85">ERROR: it failed</text>
<text x="30.0" y="276.0" text-anchor="start" font-size="12" fill-opacity="0.85">INTERRUPTED: someone stopped it</text>
<text x="30.0" y="298.0" text-anchor="start" font-size="12" fill-opacity="0.85">CANCELLED: the client left</text>
</svg>
