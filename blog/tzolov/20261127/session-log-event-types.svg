<text x="708.0" y="201.0" text-anchor="start" font-size="12" fill-opacity="0.8">the state of a turn (community)</text>
<rect x="680.0" y="220.0" width="18.0" height="18.0" rx="4" fill="#8250DF" fill-opacity="0.14" stroke="#8250DF" stroke-width="1.2"/>
<text x="708.0" y="234.0" text-anchor="start" font-size="13" font-weight="700">Spring AI Agent Utils</text>
<text x="708.0" y="253.0" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">SUBAGENT.*</text>
