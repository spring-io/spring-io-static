<text x="34.0" y="334.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">SUBAGENT.CREATED</text>
<text x="170.0" y="334.5" text-anchor="start" font-size="13">a child session for a sub-agent</text>
<text x="569.0" y="334.5" text-anchor="middle" font-size="11.5" fill-opacity="0.7">not sent to the model</text>
<rect x="24.0" y="354.0" width="616.0" height="32.0" rx="6" fill="#C77700" fill-opacity="0.14" stroke="#C77700" stroke-width="1.2"/>
<text x="34.0" y="374.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">ACME.AUDIT</text>
<text x="170.0" y="374.5" text-anchor="start" font-size="13">action: exported</text>
<text x="569.0" y="374.5" text-anchor="middle" font-size="11.5" fill-opacity="0.7">not sent to the model</text>
<rect x="24.0" y="394.0" width="616.0" height="32.0" rx="6" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/>
<text x="34.0" y="414.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">MESSAGE</text>
<text x="170.0" y="414.5" text-anchor="start" font-size="13">ASSISTANT  the final answer</text>
<rect x="506.0" y="399.0" width="126.0" height="22.0" rx="11" fill="#6DB33F"/>
<text x="569.0" y="414.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#ffffff">in the prompt</text>
<rect x="24.0" y="434.0" width="616.0" height="32.0" rx="6" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/>
<text x="34.0" y="454.5" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">COMPACTION</text>
<text x="170.0" y="454.5" text-anchor="start" font-size="13">the view starts at a later turn</text>
<text x="569.0" y="454.5" text-anchor="middle" font-size="11.5" fill-opacity="0.7">not sent to the model</text>
<rect x="664.0" y="10.0" width="312.0" height="470.0" rx="8" fill="none" stroke="#1f2328" stroke-opacity="0.3" stroke-width="1.5"/>
<text x="820.0" y="36.0" text-anchor="middle" font-size="16" font-weight="700">Who writes what</text>
<text x="820.0" y="56.0" text-anchor="middle" font-size="12" fill-opacity="0.75">an event type is a name</text>
<rect x="680.0" y="80.0" width="18.0" height="18.0" rx="4" fill="#6DB33F" fill-opacity="0.14" stroke="#6DB33F" stroke-width="1.2"/>
<text x="708.0" y="94.0" text-anchor="start" font-size="13" font-weight="700">Spring AI</text>
<text x="708.0" y="113.0" text-anchor="start" font-size="11" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">MESSAGE, COMPACTION</text>
<text x="708.0" y="131.0" text-anchor="start" font-size="12" fill-opacity="0.8">the conversation and its view</text>
<rect x="680.0" y="150.0" width="18.0" height="18.0" rx="4" fill="#3F7DE0" fill-opacity="0.14" stroke="#3F7DE0" stroke-width="1.2"/>
<text x="708.0" y="164.0" text-anchor="start" font-size="13" font-weight="700">Spring AI Session Extensions</text>
