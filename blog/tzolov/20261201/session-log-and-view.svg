<title id="session-log-and-view-title">A list with a window, and a log with a view</title>
<desc id="session-log-and-view-desc">The same conversation of five turns, stored in two ways. With ChatMemory it is a list of user messages and final answers. A window keeps the last four messages, turns four and five, and sends them to the model. Turns one to three are dropped from the list and gone, so the answer to 'What was my order number?' is that none was mentioned. With a session it is a log of events that also holds the tool calls and their results. A compaction event after the third, the fourth and the fifth turn moves the start of the view, which now holds turns four and five. Turns one to three are out of the view and still in the log: nothing is deleted. In the fifth turn the model calls conversation_search, finds the order number A-1042 in the first turn and answers with it.</desc>
<rect width="1000" height="466" rx="10" fill="#ffffff"/>
